<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演算法題庫搜尋系統</title>
<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-soft: #eff6ff;
        --answer-bg: #f0fdf4;
        --answer-border: #bbf7d0;
        --answer-text: #166534;
        --warning-bg: #fff7ed;
        --warning-text: #9a3412;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                     "Microsoft JhengHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
    }

    .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 64px;
    }

    header {
        margin-bottom: 22px;
    }

    h1 {
        margin: 0 0 6px;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--muted);
        margin: 0;
    }

    .toolbar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 26px rgba(0,0,0,.05);
        position: sticky;
        top: 10px;
        z-index: 20;
        margin-bottom: 20px;
    }

    .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
    }

    #searchInput {
        width: 100%;
        padding: 13px 15px;
        border-radius: 11px;
        border: 1px solid var(--border);
        font-size: 16px;
        outline: none;
        background: #fff;
    }

    #searchInput:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    button {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
    }

    button:hover {
        background: #f9fafb;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
    }

    .filter-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }

    .toolbar-right {
        margin-left: auto;
        display: flex;
        gap: 8px;
    }

    .summary {
        margin: 16px 2px 12px;
        color: var(--muted);
        font-size: 14px;
    }

    .question-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 14px;
        box-shadow: 0 5px 18px rgba(0,0,0,.035);
    }

    .card-top {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
    }

    .number {
        font-weight: 700;
        color: var(--primary);
    }

    .badges {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .badge {
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
    }

    .title {
        font-size: 18px;
        font-weight: 700;
        margin: 2px 0 8px;
    }

    .question {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0 0 14px;
    }

    .options {
        display: grid;
        gap: 7px;
        margin: 10px 0 14px;
    }

    .option {
        padding: 9px 11px;
        border-radius: 9px;
        background: #f9fafb;
        border: 1px solid #eef0f3;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .missing {
        margin: 10px 0 14px;
        background: var(--warning-bg);
        color: var(--warning-text);
        border-radius: 9px;
        padding: 9px 11px;
        font-size: 14px;
    }

    .answer {
        display: none;
        margin-top: 12px;
        padding: 12px 14px;
        border: 1px solid var(--answer-border);
        background: var(--answer-bg);
        color: var(--answer-text);
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        font-weight: 600;
    }

    .answer.show {
        display: block;
    }

    .answer-btn {
        border-color: #bfdbfe;
        background: var(--primary-soft);
        color: #1d4ed8;
        font-weight: 600;
    }

    .meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
    }

    mark {
        background: #fef08a;
        padding: 0 1px;
        border-radius: 2px;
    }

    .empty {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: 14px;
    }

    footer {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 28px;
    }

    @media (max-width: 700px) {
        .container {
            width: min(100% - 20px, 1100px);
            padding-top: 18px;
        }

        .toolbar {
            top: 5px;
            padding: 13px;
        }

        .search-row {
            grid-template-columns: 1fr;
        }

        .toolbar-right {
            width: 100%;
            margin-left: 0;
        }

        .toolbar-right button {
            flex: 1;
        }

        .question-card {
            padding: 15px;
        }

        .card-top {
            flex-direction: column;
        }
    }


    /* 左側固定導覽列與新增題庫 */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 230px;
        background: #111827;
        color: #fff;
        padding: 22px 14px;
        z-index: 100;
        display: flex;
        flex-direction: column;
    }

    .sidebar-brand {
        font-size: 20px;
        font-weight: 800;
        padding: 4px 10px 20px;
    }

    .sidebar-nav {
        display: grid;
        gap: 8px;
    }

    .nav-btn {
        width: 100%;
        border: 0;
        background: transparent;
        color: #d1d5db;
        text-align: left;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
    }

    .nav-btn:hover, .nav-btn.active {
        background: #1f2937;
        color: #fff;
    }

    .nav-btn.active {
        box-shadow: inset 3px 0 0 #60a5fa;
    }

    .sidebar-note {
        margin-top: auto;
        padding: 10px;
        color: #9ca3af;
        font-size: 12px;
    }

    .main-shell {
        margin-left: 230px;
        min-height: 100vh;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 8px 26px rgba(0,0,0,.05);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .field {
        display: grid;
        gap: 7px;
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
        font-weight: 700;
        font-size: 14px;
    }

    .field input, .field textarea, .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
    }

    .field input:focus, .field textarea:focus, .field select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .field textarea {
        resize: vertical;
        min-height: 115px;
    }

    .option-fields {
        display: grid;
        gap: 9px;
    }

    .help-text {
        color: var(--muted);
        font-size: 13px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    .primary-btn {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        font-weight: 700;
    }

    .primary-btn:hover { background: #1d4ed8; }

    .danger-btn {
        color: #dc2626;
        border-color: #fecaca;
        background: #fff;
    }

    .user-badge {
        color: #7c3aed;
        background: #f5f3ff;
        border-color: #ddd6fe;
    }

    .mobile-menu-btn {
        display: none;
    }

    .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: #111827;
        color: #fff;
        padding: 12px 16px;
        border-radius: 10px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: .2s;
        z-index: 300;
    }

    .toast.show {
        opacity: 1;
        transform: translateY(0);
    }

    @media (max-width: 850px) {
        .sidebar {
            transform: translateX(-100%);
            transition: .2s;
        }
        .sidebar.open { transform: translateX(0); }
        .main-shell { margin-left: 0; }
        .mobile-menu-btn {
            display: block;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 150;
            background: #111827;
            color: #fff;
            border-color: #111827;
        }
        .container { padding-top: 62px; }
        .form-grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
    }

</style>
</head>
<body>
<button id="mobileMenuBtn" class="mobile-menu-btn" type="button">☰</button>
<aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">📚 演算法題庫</div>
    <nav class="sidebar-nav">
        <button class="nav-btn active" data-panel="bank" type="button">🔎 題庫搜尋</button>
        <button class="nav-btn" data-panel="add" type="button">➕ 新增題庫</button>
    </nav>
    <div class="sidebar-note">自行新增的題目會儲存在目前瀏覽器中。</div>
</aside>
<div class="main-shell">
<div class="container">
<section id="panel-bank" class="panel active">
    <header>
        <h1>演算法題庫搜尋系統</h1>
        <p class="subtitle">輸入關鍵字，即時搜尋題目、選項與答案。</p>
    </header>

    <section class="toolbar">
        <div class="search-row">
            <input id="searchInput" type="search"
                   placeholder="搜尋：Merge Sort、插入排序、omega、lg*、費氏數列……"
                   autocomplete="off">
            <button id="clearBtn" type="button">清除搜尋</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="choice">選擇題</button>
            <button class="filter-btn" data-filter="fill_blank">填空題</button>
            <button class="filter-btn" data-filter="choice_options_missing">選項未記錄</button>

            <div class="toolbar-right">
                <button id="showAllBtn" type="button">全部顯示答案</button>
                <button id="hideAllBtn" type="button">全部隱藏答案</button>
            </div>
        </div>
    </section>

    <div id="summary" class="summary"></div>
    <main id="questionList"></main>

    <footer>
        題庫共 60 題｜由目前已整理的演算法訓練紀錄匯出
    </footer>

    </section>

    <section id="panel-add" class="panel">
        <header>
            <h1>新增題庫</h1>
            <p class="subtitle">自行建立題目，儲存後會立即加入題庫搜尋。</p>
        </header>

        <div class="form-card">
            <div class="form-grid">
                <div class="field">
                    <label for="newType">題型</label>
                    <select id="newType">
                        <option value="choice">選擇題</option>
                        <option value="fill_blank">填空題</option>
                    </select>
                </div>

                <div class="field">
                    <label for="newTitle">題目標題</label>
                    <input id="newTitle" type="text" placeholder="例如：Merge Sort 時間複雜度">
                </div>

                <div class="field full">
                    <label for="newQuestion">題目內容 *</label>
                    <textarea id="newQuestion" placeholder="請輸入完整題目"></textarea>
                </div>

                <div id="choiceArea" class="field full">
                    <label>選項</label>
                    <div class="option-fields">
                        <input id="optA" type="text" placeholder="A. 選項內容">
                        <input id="optB" type="text" placeholder="B. 選項內容">
                        <input id="optC" type="text" placeholder="C. 選項內容">
                        <input id="optD" type="text" placeholder="D. 選項內容">
                    </div>
                    <div class="help-text">可以少於四個選項；空白的選項不會儲存。</div>
                </div>

                <div class="field full">
                    <label for="newAnswer">正確答案 *</label>
                    <textarea id="newAnswer" placeholder="例如：B. 分治法 (Divide-and-Conquer)"></textarea>
                </div>

                <div class="field full">
                    <label for="newKeywords">搜尋關鍵字</label>
                    <input id="newKeywords" type="text" placeholder="例如：merge sort, 合併排序, divide and conquer">
                    <div class="help-text">多個關鍵字請用逗號分隔。</div>
                </div>
            </div>

            <div class="form-actions">
                <button id="saveQuestionBtn" class="primary-btn" type="button">儲存題目</button>
                <button id="resetFormBtn" type="button">清空表單</button>
            </div>
        </div>

        <div style="margin-top:22px">
            <h2>我新增的題目</h2>
            <div id="userQuestionList"></div>
        </div>
    </section>
</div>
</div>
<div id="toast" class="toast"></div>

<script>

const STORAGE_KEY = "algorithm_question_bank_user_questions_v1";

function loadUserQuestions() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

function saveUserQuestions(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

QUESTIONS.push(...loadUserQuestions());

let currentFilter = "all";
let answersVisible = new Set();

const searchInput = document.getElementById("searchInput");
const list = document.getElementById("questionList");
const summary = document.getElementById("summary");

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function normalize(value) {
    return String(value ?? "").toLowerCase().replace(/\s+/g, " ").trim();
}

function highlight(value, term) {
    const safe = escapeHtml(value);
    if (!term) return safe;

    const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try {
        return safe.replace(new RegExp(escapedTerm, "gi"), match => `<mark>${match}</mark>`);
    } catch {
        return safe;
    }
}

function searchableText(q) {
    return normalize([
        q.id,
        q.title,
        q.type,
        q.question,
        ...(q.options || []),
        q.correct_answer,
        ...(q.answer_variants || []),
        ...(q.keywords || []),
        ...(q.sources || [])
    ].join(" "));
}

function getTypeLabel(type) {
    if (type === "fill_blank") return "填空題";
    if (type === "choice") return "選擇題";
    if (type === "choice_options_missing") return "選擇題／選項未記錄";
    return type || "未分類";
}

function getFilteredQuestions() {
    const term = normalize(searchInput.value);
    return QUESTIONS.filter(q => {
        const typeMatch = currentFilter === "all" || q.type === currentFilter;
        const textMatch = !term || searchableText(q).includes(term);
        return typeMatch && textMatch;
    });
}

function render() {
    const term = normalize(searchInput.value);
    const filtered = getFilteredQuestions();

    const userCount = QUESTIONS.filter(q => q.user_created).length;
    summary.textContent =
        `目前顯示 ${filtered.length} / ${QUESTIONS.length} 題｜自行新增 ${userCount} 題` +
        (term ? `｜搜尋：「${searchInput.value.trim()}」` : "");

    if (!filtered.length) {
        list.innerHTML = `<div class="empty">找不到符合條件的題目，試試其他關鍵字。</div>`;
        return;
    }

    list.innerHTML = filtered.map(q => {
        const answerShown = answersVisible.has(q.id);
        const options = q.options || [];

        const optionsHtml = options.length
            ? `<div class="options">${options.map(o =>
                `<div class="option">${highlight(o, term)}</div>`
              ).join("")}</div>`
            : (q.type === "choice_options_missing"
                ? `<div class="missing">這題的原始訓練紀錄沒有保存完整選項，因此未自行補寫。</div>`
                : "");

        const seenText = q.times_seen_in_0930
            ? `｜0930 訓練出現 ${q.times_seen_in_0930} 次`
            : "";

        return `
        <article class="question-card" data-id="${q.id}">
            <div class="card-top">
                <div class="number">#${q.id}</div>
                <div class="badges">
                    <span class="badge">${escapeHtml(getTypeLabel(q.type))}</span>
                    ${q.times_seen_in_0930 ? `<span class="badge">刷過 ${q.times_seen_in_0930} 次</span>` : ""}
                    ${q.user_created ? `<span class="badge user-badge">自行新增</span>` : ""}
                </div>
            </div>

            <div class="title">${highlight(q.title || "", term)}</div>
            <div class="question">${highlight(q.question || "", term)}</div>

            ${optionsHtml}

            <button class="answer-btn" type="button"
                    onclick="toggleAnswer(${q.id})">
                ${answerShown ? "隱藏答案" : "顯示正確答案"}
            </button>

            <div class="answer ${answerShown ? "show" : ""}">
                正確答案：${highlight(q.correct_answer || "未記錄", term)}
            </div>

            <div class="meta">
                題型：${escapeHtml(getTypeLabel(q.type))}${seenText}
            </div>
        </article>`;
    }).join("");
}

window.toggleAnswer = function(id) {
    if (answersVisible.has(id)) answersVisible.delete(id);
    else answersVisible.add(id);
    render();
};

searchInput.addEventListener("input", render);

document.getElementById("clearBtn").addEventListener("click", () => {
    searchInput.value = "";
    searchInput.focus();
    render();
});

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
    });
});

document.getElementById("showAllBtn").addEventListener("click", () => {
    getFilteredQuestions().forEach(q => answersVisible.add(q.id));
    render();
});

document.getElementById("hideAllBtn").addEventListener("click", () => {
    answersVisible.clear();
    render();
});


function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
}

function renderUserQuestions() {
    const target = document.getElementById("userQuestionList");
    const items = QUESTIONS.filter(q => q.user_created);

    if (!items.length) {
        target.innerHTML = `<div class="empty">你目前還沒有新增任何題目。</div>`;
        return;
    }

    target.innerHTML = items.map(q => `
        <article class="question-card">
            <div class="card-top">
                <div>
                    <div class="number">${escapeHtml(q.title || "自訂題目")}</div>
                    <div class="meta">${escapeHtml(getTypeLabel(q.type))}</div>
                </div>
                <button class="danger-btn" type="button" onclick="deleteUserQuestion(${q.id})">刪除</button>
            </div>
            <div class="question">${escapeHtml(q.question || "")}</div>
            <div class="answer show">正確答案：${escapeHtml(q.correct_answer || "")}</div>
        </article>
    `).join("");
}

window.deleteUserQuestion = function(id) {
    const saved = loadUserQuestions().filter(q => q.id !== id);
    saveUserQuestions(saved);
    const index = QUESTIONS.findIndex(q => q.user_created && q.id === id);
    if (index >= 0) QUESTIONS.splice(index, 1);
    answersVisible.delete(id);
    renderUserQuestions();
    render();
    showToast("題目已刪除");
};

function resetQuestionForm() {
    document.getElementById("newType").value = "choice";
    document.getElementById("newTitle").value = "";
    document.getElementById("newQuestion").value = "";
    document.getElementById("optA").value = "";
    document.getElementById("optB").value = "";
    document.getElementById("optC").value = "";
    document.getElementById("optD").value = "";
    document.getElementById("newAnswer").value = "";
    document.getElementById("newKeywords").value = "";
    document.getElementById("choiceArea").style.display = "";
}

const newType = document.getElementById("newType");
newType.addEventListener("change", () => {
    document.getElementById("choiceArea").style.display = newType.value === "choice" ? "" : "none";
});

document.getElementById("saveQuestionBtn").addEventListener("click", () => {
    const type = newType.value;
    const title = document.getElementById("newTitle").value.trim();
    const question = document.getElementById("newQuestion").value.trim();
    const correctAnswer = document.getElementById("newAnswer").value.trim();
    const keywords = document.getElementById("newKeywords").value
        .split(",").map(v => v.trim()).filter(Boolean);

    if (!question) {
        alert("請輸入題目內容。");
        return;
    }
    if (!correctAnswer) {
        alert("請輸入正確答案。");
        return;
    }

    const options = type === "choice"
        ? ["optA", "optB", "optC", "optD"]
            .map(id => document.getElementById(id).value.trim())
            .filter(Boolean)
        : [];

    const item = {
        id: Date.now(),
        title,
        type,
        question,
        options,
        options_status: options.length ? "user_created" : "not_applicable_or_not_recorded",
        correct_answer: correctAnswer,
        answer_variants: [correctAnswer],
        answer_basis: "user_created",
        sources: ["使用者新增"],
        keywords,
        user_created: true,
        created_at: new Date().toISOString()
    };

    const saved = loadUserQuestions();
    saved.unshift(item);
    saveUserQuestions(saved);
    QUESTIONS.push(item);

    resetQuestionForm();
    renderUserQuestions();
    render();
    showToast("題目已新增到題庫");
});

document.getElementById("resetFormBtn").addEventListener("click", resetQuestionForm);

document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        document.getElementById("panel-" + btn.dataset.panel).classList.add("active");
        document.getElementById("sidebar").classList.remove("open");
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
});

document.getElementById("mobileMenuBtn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
});

renderUserQuestions();

render();
</script>
</body>
</html>
