<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習題庫</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body class="home-mode">
<section id="subjectHome" class="subject-home" aria-labelledby="subjectHeading">
    <div class="home-art" aria-hidden="true">
        <svg class="silver-ribbons" viewBox="0 0 1440 960" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="ribbonSilver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#879bb8"/><stop offset=".22" stop-color="#fff"/><stop offset=".38" stop-color="#adbed6"/><stop offset=".52" stop-color="#fff"/><stop offset=".7" stop-color="#d8d9ec"/><stop offset="1" stop-color="#8ca4bf"/></linearGradient>
                <radialGradient id="pearlSilver"><stop stop-color="#fff"/><stop offset=".5" stop-color="#e2e8f5"/><stop offset="1" stop-color="#94acc7"/></radialGradient>
                <symbol id="homeStar" viewBox="0 0 40 40"><path d="M20 0 23 16 40 20 23 23 20 40 17 23 0 20 17 16Z" fill="white"/><circle cx="20" cy="20" r="4" fill="white"/></symbol>
                <symbol id="chromeFlower" viewBox="0 0 100 100"><g fill="url(#pearlSilver)" stroke="#fff" stroke-width="1"><ellipse cx="50" cy="27" rx="13" ry="26"/><ellipse cx="50" cy="27" rx="13" ry="26" transform="rotate(60 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="26" transform="rotate(120 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="26" transform="rotate(180 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="26" transform="rotate(240 50 50)"/><ellipse cx="50" cy="27" rx="13" ry="26" transform="rotate(300 50 50)"/><circle cx="50" cy="50" r="10"/></g></symbol>
            </defs>
            <g fill="none">
                <path d="M-140 100 C260 -110 390 240 800 90 S1320 -50 1580 170" stroke="url(#ribbonSilver)" stroke-width="26"/>
                <path d="M-140 100 C260 -110 390 240 800 90 S1320 -50 1580 170" stroke="white" stroke-width="1.5"/>
                <path d="M-120 870 C320 580 430 1030 900 800 S1270 480 1560 640" stroke="url(#ribbonSilver)" stroke-width="38"/>
                <path d="M-120 870 C320 580 430 1030 900 800 S1270 480 1560 640" stroke="white" stroke-width="2"/>
                <g stroke="white" stroke-width="1" opacity=".6">
                    <path d="M-80 180 Q540 -30 1490 250"/><path d="M-80 190 Q540 -20 1490 260"/><path d="M-80 200 Q540 -10 1490 270"/>
                    <path d="M-160 650 Q800 1000 1520 540"/><path d="M-160 660 Q800 1010 1520 550"/><path d="M-160 670 Q800 1020 1520 560"/>
                    <ellipse cx="725" cy="440" rx="900" ry="260" transform="rotate(-24 725 440)"/>
                    <ellipse cx="725" cy="440" rx="910" ry="272" transform="rotate(-24 725 440)"/>
                </g>
            </g>
            <use href="#chromeFlower" x="1200" y="160" width="115" height="115" transform="rotate(15 1250 210)"/>
            <use href="#chromeFlower" x="80" y="660" width="82" height="82"/>
            <g opacity=".95"><use href="#homeStar" x="120" y="220" width="52" height="52"/><use href="#homeStar" x="330" y="130" width="24" height="24"/><use href="#homeStar" x="1110" y="95" width="44" height="44"/><use href="#homeStar" x="1270" y="540" width="56" height="56"/><use href="#homeStar" x="185" y="585" width="30" height="30"/><use href="#homeStar" x="470" y="810" width="48" height="48"/><use href="#homeStar" x="950" y="740" width="30" height="30"/></g>
            <g fill="url(#pearlSilver)"><circle cx="220" cy="150" r="7"/><circle cx="1280" cy="380" r="10"/><circle cx="1180" cy="710" r="6"/><circle cx="300" cy="740" r="9"/></g>
        </svg>
    </div>
    <div class="home-content">
    <header><p class="home-eyebrow">學習題庫</p><h1 id="subjectHeading" tabindex="-1">今天要學習哪個科目？</h1><p class="subtitle">既然無法修仙 不如來魔修</p></header>
    <div class="subject-grid">
        <button id="algorithmSubjectBtn" class="subject-card" type="button"><span class="subject-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><g fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="40" cy="40" rx="34" ry="13" transform="rotate(-35 40 40)"/><ellipse cx="40" cy="40" rx="34" ry="13" transform="rotate(35 40 40)"/><circle cx="40" cy="40" r="22"/><path d="M28 35 22 40 28 45 M52 35 58 40 52 45 M43 30 37 50"/></g><circle cx="67" cy="20" r="4" fill="currentColor"/></svg></span><span class="subject-title">演算法</span><span class="subject-description">依單元練習與搜尋題目</span><span class="subject-status">進入題庫 →</span></button>
        <button id="osSubjectBtn" class="subject-card subject-coming" type="button" disabled><span class="subject-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="20" y="20" width="40" height="40" rx="8"/><rect x="30" y="30" width="20" height="20" rx="4"/><path d="M30 12V20 M40 12V20 M50 12V20 M30 60V68 M40 60V68 M50 60V68 M12 30H20 M12 40H20 M12 50H20 M60 30H68 M60 40H68 M60 50H68"/></g></svg></span><span class="subject-title">作業系統</span><span class="subject-description">更多單元題庫準備中</span><span class="subject-status">尚未開放</span></button>
    </div>
    <noscript><p class="missing">請啟用 JavaScript 才能選擇科目與使用題庫。</p></noscript>
    </div>
    <button id="musicToggleBtn" class="music-toggle" type="button" aria-label="開啟音樂播放器" aria-controls="musicPanel" aria-expanded="false" title="播放音樂">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="6" cy="18" rx="3" ry="2.5" fill="currentColor"/><ellipse cx="17" cy="16" rx="3" ry="2.5" fill="currentColor"/></svg>
    </button>
    <section id="musicPanel" class="music-panel" aria-labelledby="musicHeading" hidden>
        <div class="music-panel-header"><h2 id="musicHeading">練習前，先聽首歌</h2><button id="musicCloseBtn" type="button" aria-label="關閉音樂播放器">✕</button></div>
        <div id="musicPlayerHost"></div>
        <p class="music-help">若未開始播放，請點播放器中的播放鍵。</p>
        <a href="https://www.youtube.com/watch?v=xKhBGvx4W98" target="_blank" rel="noopener noreferrer">在 YouTube 開啟 ↗</a>
    </section>
</section>
<button hidden id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="展開選單">☰</button>
<button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="關閉選單" tabindex="-1" hidden></button>
<aside hidden id="sidebar" class="sidebar collapsed" inert>
    <a class="sidebar-brand" href="https://canva.link/evygbbmrt3v2umy" target="_blank" rel="noopener noreferrer">📚 演算法題庫</a>
    <nav class="sidebar-nav">
        <button class="nav-btn active" data-panel="bank" type="button">🔎 題庫搜尋</button>
        <button class="nav-btn" data-panel="units" type="button">📖 選擇單元</button>
        <button class="nav-btn" data-panel="add" type="button">➕ 新增題庫</button>
    </nav>
    <button id="switchSubjectBtn" class="nav-btn" type="button">↩ 切換科目</button>
    <div class="sidebar-note">自行新增的題目會儲存在目前瀏覽器中。</div>
</aside>
<div id="studyShell" class="main-shell" hidden>
<div class="container">
<section id="panel-bank" class="panel active">
    <header>
        <p id="currentUnitLabel" class="unit-context">演算法｜U2</p>
        <h1 id="bankHeading" tabindex="-1">演算法題庫搜尋系統</h1>
        <p class="subtitle">輸入關鍵字，即時搜尋題目、選項與答案。</p>
    </header>

    <section class="toolbar">
        <div class="search-row">
            <input id="searchInput" type="search"
                   placeholder="搜尋：Merge Sort、插入排序、omega、lg*、費氏數列……"
                   autocomplete="off">
            <button id="clearBtn" type="button">清除搜尋</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="choice">選擇題</button>
            <button class="filter-btn" data-filter="fill_blank">填空題</button>
            <button class="filter-btn" data-filter="disputed">爭議題型</button>

            <div class="toolbar-right">
                <button id="showAllBtn" type="button">全部顯示答案</button>
                <button id="hideAllBtn" type="button">全部隱藏答案</button>
            </div>
        </div>
    </section>

    <div class="summary">
        <span id="summary" role="status" aria-live="polite"></span>
        <nav class="pagination" aria-label="題庫分頁">
            <button id="prevPageBtn" type="button">上一頁</button>
            <span id="pageInfo" aria-live="polite"></span>
            <button id="nextPageBtn" type="button">下一頁</button>
        </nav>
    </div>
    <main id="questionList"><div class="empty" role="status">題庫載入中……</div></main>
    <noscript><p class="missing">請啟用 JavaScript 才能使用題庫搜尋。</p></noscript>

    <footer id="bankFooter"></footer>

    </section>

    <section id="panel-units" class="panel">
        <header>
            <h1>選擇單元</h1>
            <p class="subtitle">選擇想練習的題庫單元。</p>
        </header>
        <div id="unitGrid" class="unit-grid"></div>
    </section>

    <section id="panel-add" class="panel">
        <header>
            <h1>新增題庫</h1>
            <p class="subtitle">自行建立題目，儲存後會加入目前單元的題庫。</p>
        </header>

        <div class="form-card">
            <p id="addUnitLabel" class="unit-context"></p>
            <div class="form-grid">
                <div class="field">
                    <label for="newType">題型</label>
                    <select id="newType">
                        <option value="choice">選擇題</option>
                        <option value="fill_blank">填空題</option>
                    </select>
                </div>

                <div class="field">
                    <label for="newTitle">題目標題</label>
                    <input id="newTitle" type="text" placeholder="例如：Merge Sort 時間複雜度">
                </div>

                <div class="field full">
                    <label for="newQuestion">題目內容 *</label>
                    <textarea id="newQuestion" placeholder="請輸入完整題目"></textarea>
                </div>

                <div id="choiceArea" class="field full">
                    <label>選項</label>
                    <div class="option-fields">
                        <input id="optA" type="text" placeholder="A. 選項內容">
                        <input id="optB" type="text" placeholder="B. 選項內容">
                        <input id="optC" type="text" placeholder="C. 選項內容">
                        <input id="optD" type="text" placeholder="D. 選項內容">
                    </div>
                    <div class="help-text">可以少於四個選項；空白的選項不會儲存。</div>
                </div>

                <div class="field full">
                    <label for="newAnswer">正確答案 *</label>
                    <textarea id="newAnswer" placeholder="例如：B. 分治法 (Divide-and-Conquer)"></textarea>
                </div>

                <div class="field full">
                    <label for="newKeywords">搜尋關鍵字</label>
                    <input id="newKeywords" type="text" placeholder="例如：merge sort, 合併排序, divide and conquer">
                    <div class="help-text">多個關鍵字請用逗號分隔。</div>
                </div>
            </div>

            <div class="form-actions">
                <button id="saveQuestionBtn" class="primary-btn" type="button">儲存題目</button>
                <button id="resetFormBtn" type="button">清空表單</button>
            </div>
        </div>

        <div style="margin-top:22px">
            <h2>我新增的題目</h2>
            <div id="userQuestionList"></div>
        </div>
    </section>
</div>
</div>
<button id="backToTopBtn" class="back-to-top" type="button" aria-label="回到頁面頂端" hidden>↑ 回到頂端</button>
<div id="toast" class="toast"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
